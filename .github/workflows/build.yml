name: IriskaGram

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. 1.0)'
        required: true
        default: '1.0'
        type: string

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install beautifulsoup4 debugpy lxml packaging pillow requests PyYAML

      - name: Setup Android SDK and Licenses
        run: |
          SDKMANAGER=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}" -name sdkmanager -type f 2>/dev/null | head -n 1)
          echo "Found sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0" "cmake;3.22.1" "ndk;29.0.14206865"
          "$SDKMANAGER" --channel=3 --install "platforms;android-37" || true
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/29.0.14206865" >> $GITHUB_ENV

      - name: Prepare keystore
        run: |
          chmod +x gradlew
          mkdir -p TMessagesProj/config
          if [ ! -f TMessagesProj/config/debug.keystore ]; then
            keytool -genkeypair -v -keystore TMessagesProj/config/debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build APK (Full Arm64 Release)
        env:
          BUILD_PYTHON: python3
        run: |
          ./gradlew :TMessagesProj:assembleFullArm64Release --stacktrace

      - name: Rename APK
        run: |
          cp "$(find TMessagesProj/build/outputs/apk -name '*.apk' | head -n 1)" IriskaGram.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IriskaGram
          path: IriskaGram.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: IriskaGram.apk
          tag_name: ${{ inputs.version }}
          name: IriskaGram v1
          body: |
            first release of iriskagram, yay!!
